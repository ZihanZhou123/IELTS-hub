<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Test - IELTS Master</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

<header>
    <a href="../index.html" class="logo">IELTS Master</a>
    <nav aria-label="Main navigation">
        <a href="../index.html" data-i18n="home">Home</a>
        <a href="courses.html" data-i18n="courses">Courses</a>
        <a href="reading.html" data-i18n="reading">Reading</a>
        <a href="listening.html" data-i18n="listening">Listening</a>
        <a href="intensive-listening.html" data-i18n="intensive">Intensive</a>
        <a href="writing.html" data-i18n="writing">Writing</a>
        <a href="speaking.html" data-i18n="speaking">Speaking</a>
        <a href="login.html" data-i18n="login">Login</a>
    </nav>
    <button id="languageBtn" type="button" aria-label="Switch language">中文</button>
</header>

<main class="lesson-container">
    <section id="mockSelect">
        <p class="tagline" data-i18n="academicTagline">IELTS ACADEMIC TRAINING</p>
        <h1 data-i18n="chooseTest">Choose a Practice Test</h1>
        <p class="description" data-i18n="chooseTestDesc">
            Time yourself under real exam conditions.
        </p>

        <div class="mock-options">
            <!-- 注意：这里的按钮去掉了 data-minutes，现在点击直接跳转到对应页面 -->
            <button type="button" class="mock-option" onclick="window.location.href='listening.html?mode=mock&subject=listening'">
                <h3 data-i18n="listening">Listening</h3>
                <p>40 minutes</p>
            </button>
            <button type="button" class="mock-option" onclick="window.location.href='reading.html?mode=mock&subject=reading'">
                <h3 data-i18n="reading">Reading</h3>
                <p>60 minutes</p>
            </button>
            <button type="button" class="mock-option" onclick="alert('写作模考暂未开放，请前往 Writing 页面自由练习。')">
                <h3 data-i18n="writing">Writing</h3>
                <p>60 minutes</p>
            </button>
            <button type="button" class="mock-option" onclick="alert('口语模考暂未开放，请前往 Speaking 页面自由练习。')">
                <h3 data-i18n="speaking">Speaking</h3>
                <p>11–14 minutes</p>
            </button>
        </div>
    </section>
</main>

<script src="../data.js"></script>
<script src="../script.js"></script>
</body>
</html>
