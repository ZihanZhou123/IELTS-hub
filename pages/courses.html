<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="IELTS Master 名师好课">
    <title>Popular Courses - IELTS Master</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

<header>
    <a href="../index.html" class="logo">IELTS Master</a>
    
    <nav aria-label="Main navigation">
        <a href="../index.html" data-i18n="home">Home</a>
        <a href="courses.html" data-i18n="courses">Courses</a>
        <a href="reading.html" data-i18n="reading">Reading</a>
        <a href="listening.html" data-i18n="listening">Listening</a>
        <a href="intensive-listening.html" data-i18n="intensive">Intensive</a>
        <a href="writing.html" data-i18n="writing">Writing</a>
        <a href="speaking.html" data-i18n="speaking">Speaking</a>
        <a href="login.html" data-i18n="login">Login</a>
    </nav>
    
    <button id="languageBtn" type="button" aria-label="Switch language">中文</button>
</header>

<main class="lesson-container course-container">
    <div class="course-header">
        <p class="tagline" data-i18n="academicTagline">IELTS ACADEMIC TRAINING</p>
        <h1 data-i18n="courseTitle">B站名师好课</h1>
        <p class="description" data-i18n="courseDesc">
            精选B站高播放量、好口碑的雅思免费课程，帮你快速突破瓶颈。
        </p>
    </div>

    <div class="course-controls">
        <input type="text" id="courseSearch" class="course-search" data-i18n-placeholder="courseSearchPlaceholder" placeholder="搜索课程、老师（如：王陆、口语）...">
        
        <div class="course-tabs">
            <button class="tab-btn active" data-filter="all" data-i18n="tabAll">全部</button>
            <button class="tab-btn" data-filter="listening" data-i18n="listening">听力</button>
            <button class="tab-btn" data-filter="speaking" data-i18n="speaking">口语</button>
            <button class="tab-btn" data-filter="reading" data-i18n="reading">阅读</button>
            <button class="tab-btn" data-filter="writing" data-i18n="writing">写作</button>
        </div>
    </div>

    <div class="course-grid" id="courseGrid"></div>
    
    <div id="noResults" class="no-results" style="display: none;">
        没有找到相关课程，换个关键词试试吧~
    </div>
</main>

<script src="../script.js"></script>
</body>
</html>
