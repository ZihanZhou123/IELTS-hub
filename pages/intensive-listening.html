<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="IELTS Master 精听练习">
    <title>Intensive Listening - IELTS Master</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

<header>
    <a href="../index.html" class="logo">IELTS Master</a>
    <nav aria-label="Main navigation">
        <a href="../index.html" data-i18n="home">Home</a>
        <a href="courses.html" data-i18n="courses">Courses</a>
        <a href="reading.html" data-i18n="reading">Reading</a>
        <a href="listening.html" data-i18n="listening">Listening</a>
        <a href="intensive-listening.html" data-i18n="intensive">Intensive</a> <!-- 新增 -->
        <a href="writing.html" data-i18n="writing">Writing</a>
        <a href="speaking.html" data-i18n="speaking">Speaking</a>
        <a href="login.html" data-i18n="login">Login</a>
    </nav>
    <button id="languageBtn" type="button" aria-label="Switch language">中文</button>
</header>

<main class="lesson-container">
    <p class="tagline" data-i18n="academicTagline">IELTS ACADEMIC TRAINING</p>
    <h1 data-i18n="intensiveTitle">精听听写练习</h1>
    <p class="description" data-i18n="intensiveDesc">
        播放下方音频，将你听到的内容写下来。系统会逐词帮你核对！
    </p>

    <section class="lesson-card">
        <!-- 这里放了一个公开的英语测试音频，你可以换成你自己的真题音频链接 -->
        <div class="audio-player-container">
            <audio id="dictationAudio" controls>
    <source src="http://www.elllo.org/Audio/A0151/153-Matt-Manchester.mp3" type="audio/mpeg">
    您的浏览器不支持音频播放。
</audio>
        </div>

        <h3 data-i18n="intensiveListenWrite">听写区域</h3>
        <textarea id="dictationInput" class="essay-input" 
                  placeholder="请在这里输入你听到的内容..." rows="5"></textarea>

        <div class="intensive-actions">
            <button type="button" class="primary-btn" onclick="checkDictation()" data-i18n="intensiveCheck">检查听写</button>
            <button type="button" class="secondary-btn" onclick="toggleTranscript()" id="transcriptBtn" data-i18n="intensiveShow">显示原文</button>
        </div>

        <div id="dictationResult" class="dictation-result" style="display: none;">
            <!-- 对比结果会渲染在这里 -->
        </div>
        
        <div id="transcriptContainer" class="transcript-box" style="display: none;">
            <h4 data-i18n="intensiveOriginal">原文：</h4>
            <p id="transcriptText"></p>
        </div>
    </section>
</main>

<script src="../script.js"></script>
</body>
</html>
